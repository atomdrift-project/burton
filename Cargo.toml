[package]
name = "burton"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["The Atomdrift Project"]
description = "Bloom-filter allow/deny bundles for skipping work you have already done"
license = "Apache-2.0"
repository = "https://github.com/atomdrift-project/burton"
documentation = "https://docs.rs/burton"
readme = "README.md"
keywords = ["bloom-filter", "allowlist", "supply-chain", "scanner"]
categories = ["data-structures", "filesystem"]
include = ["/src", "/tests", "/benches", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "burton"
harness = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
